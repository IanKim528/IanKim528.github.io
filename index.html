<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ian Kim의 개인 홈페이지" />
    <title>Ian Kim | 개인 홈페이지</title>
    <style>
      :root { --ink: #17202a; --muted: #5d6875; --line: #e6e9ed; --paper: #fff; --background: #f7f8fa; --accent: #126b5d; --accent-soft: #e4f4f0; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--background); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.7; }
      a { color: inherit; }
      .wrap { width: min(100% - 40px, 880px); margin: 0 auto; }
      header { padding: 24px 0; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, 0.9); }
      nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .brand { font-weight: 750; text-decoration: none; }
      .nav-links { display: flex; gap: 18px; }
      .nav-links a { color: var(--muted); font-size: 0.94rem; text-decoration: none; }
      .nav-links a:hover { color: var(--accent); }
      main { padding: 72px 0 52px; }
      .intro { padding: 24px 0 68px; }
      .eyebrow { margin: 0 0 12px; color: var(--accent); font-size: 0.92rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .profile-photo { display: block; width: 132px; height: 132px; margin: 0 0 22px; border: 5px solid var(--paper); border-radius: 50%; object-fit: cover; object-position: center; box-shadow: 0 8px 24px rgba(23, 32, 42, 0.14); }
      h1, h2 { line-height: 1.2; }
      h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5.2rem); letter-spacing: -0.06em; }
      .lead { max-width: 620px; margin: 25px 0 0; color: var(--muted); font-size: clamp(1.08rem, 2.6vw, 1.3rem); }
      section { padding: 36px; margin-top: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); }
      h2 { margin: 0 0 16px; font-size: 1.35rem; letter-spacing: -0.025em; }
      section p { margin: 0; color: var(--muted); }
      .interests { display: flex; flex-wrap: wrap; gap: 10px; margin: 0; padding: 0; list-style: none; }
      .interests li { padding: 7px 13px; border-radius: 999px; color: var(--accent); background: var(--accent-soft); font-size: 0.95rem; font-weight: 650; }
      .contact-link { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
      footer { padding: 0 0 38px; color: var(--muted); font-size: 0.9rem; }
      @media (max-width: 560px) { .wrap { width: min(100% - 32px, 880px); } header { padding: 18px 0; } .nav-links { gap: 13px; font-size: 0.88rem; } main { padding-top: 48px; } .intro { padding-bottom: 42px; } .profile-photo { width: 108px; height: 108px; } section { padding: 26px 22px; } }
    </style>
  </head>
  <body>
    <header>
      <nav class="wrap" aria-label="주요 메뉴">
        <a class="brand" href="#top">Ian Kim</a>
        <div class="nav-links"><a href="#about">소개</a><a href="#interests">관심사</a><a href="#contact">연락처</a></div>
      </nav>
    </header>
    <main id="top" class="wrap">
      <div class="intro">
        <p class="eyebrow">Personal website</p>
        <img class="profile-photo" src="assets/profile.jpg" alt="Ian Kim의 프로필 사진" />
        <h1>안녕하세요,<br />Ian Kim입니다.</h1>
        <p class="lead">배우고, 만들고, 조금씩 더 나은 아이디어를 찾아가는 사람입니다.</p>
      </div>
      <section id="about">
        <h2>소개</h2>
        <p>서울대학교 첨단융합학부 26학번</p>
      </section>
      <section id="interests">
        <h2>관심사</h2>
        <ul class="interests"><li>웹 만들기</li><li>새로운 기술</li><li>디자인</li><li>배움과 기록</li></ul>
      </section>
      <section id="contact">
        <h2>연락처</h2>
        <p>편하게 연락해 주세요. 이메일 주소를 아래에 넣어 두면 됩니다.<br /><a class="contact-link" href="mailto:hello@example.com">hello@example.com</a></p>
      </section>
    </main>
    <footer class="wrap">© 2026 Ian Kim. All rights reserved.</footer>
  </body>
</html>
